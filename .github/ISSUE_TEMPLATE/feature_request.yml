name: "Feature request"
description: "Suggest an improvement to BustaSQL"
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "Explain the problem and the benefit. Suggestions are welcome but not delivery commitments."
  - type: dropdown
    id: area
    attributes:
      label: "Area"
      options:
        - "Connections / authentication"
        - "New database engine"
        - "Object explorer"
        - "Query editor / IntelliSense"
        - "Results grid / export"
        - "Schema / Data Compare"
        - "Execution plans / performance"
        - "Table designer"
        - "AI assistant"
        - "Accessibility"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What problem are you trying to solve?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "What would you like to change?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives or examples (optional)"
      description: "For example, how another tool (SSMS, Azure Data Studio, DBeaver…) handles it."
